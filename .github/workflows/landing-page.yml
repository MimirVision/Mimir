name: Landing page

# Publishes desktop/landing-page to GitHub Pages.
#
# Pages can only serve from a repository root or /docs, and the page lives in
# desktop/landing-page next to the app it describes. Moving it to satisfy
# Pages would separate it from the thing it documents, so it is uploaded as an
# artifact instead and the folder stays where it belongs.
#
# Path-filtered: editing the scanner should not redeploy a website.

on:
  push:
    branches: [main]
    paths:
      - 'desktop/landing-page/**'
      - 'design-system/tokens.css'
      - '.github/workflows/landing-page.yml'
  workflow_dispatch:

# Required by actions/deploy-pages. `contents: read` is deliberately not
# `write` -- this job publishes a site, it has no business pushing commits.
permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once, but let a queued one finish rather than
# cancelling it: a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Staged rather than uploading desktop/landing-page directly, because the
      # stylesheet imports the shared design tokens from design-system/, which
      # sits outside the folder. Publishing the folder alone would deploy a
      # page whose @import 404s -- and a 404 on a stylesheet import is silent:
      # the page still renders, just with every colour and size missing.
      - name: Stage the site
        shell: bash
        run: |
          mkdir -p _site
          cp -r desktop/landing-page/. _site/
          cp design-system/tokens.css _site/tokens.css
          # The page is served flat, so rewrite the repo-relative import to sit
          # beside the stylesheet.
          sed -i 's|\.\./\.\./design-system/tokens\.css|./tokens.css|' _site/styles.css
          echo "Staged:"; ls -1 _site

      # Cheap guard against publishing a page whose assets 404. The download
      # link deliberately points at a GitHub release and is not checked here;
      # everything else must exist in what is about to ship.
      - name: Check every local reference resolves
        shell: bash
        run: |
          cd _site
          missing=0
          refs=$(grep -oE '(href|src)="\./[^"]+"' index.html | sed -E 's/.*"\.\/(.*)"/\1/')
          # CSS @import counts too, and is the one that fails silently.
          refs="$refs $(grep -oE '@import "\./[^"]+"' styles.css | sed -E 's/.*"\.\/(.*)"/\1/')"
          for ref in $(echo "$refs" | tr ' ' '\n' | sort -u); do
            if [ -n "$ref" ] && [ ! -f "$ref" ]; then
              echo "::error::references ./$ref, which is not in the staged site"
              missing=1
            fi
          done
          if grep -q '\.\./' styles.css; then
            echo "::error::styles.css still contains a path that escapes the site root"
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "All local references resolve."
          exit $missing

      # Every run of this workflow has died here, so the site has never been
      # published and no link on it has ever resolved.
      #
      # Without enablement it fails "Get Pages site failed. Please verify that
      # the repository has Pages enabled". With it, the action tries to create
      # the site and fails "Resource not accessible by integration" -- pages:
      # write on the job is not sufficient, because creating a Pages site also
      # needs the repository to allow workflows read and write access
      # (Settings -> Actions -> General -> Workflow permissions).
      #
      # Left switched on so this starts working the moment that setting changes,
      # or Pages is turned on by hand at Settings -> Pages -> Source: GitHub
      # Actions. Either one is enough; neither can be done from in here.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
