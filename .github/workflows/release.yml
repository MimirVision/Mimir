name: Release

# Publishes the Windows installer as a GitHub Release asset, which is how the
# download page gets a real URL and free bandwidth for a ~250 MB file.
#
# Triggered by pushing a tag like v0.5.0-free-beta.1. The tag must match the
# version in desktop/package.json -- a mismatch is a hard failure rather than a
# silently mislabelled download, because the release check pins signature
# verification to the package version.
#
# The release is created as a DRAFT. Nothing becomes publicly downloadable
# until a human opens it and presses publish.
#
# Monorepo notes: this moved from desktop/.github/workflows/ because GitHub
# only runs workflows from the repo root. The separate `Check out backend`
# step is gone with it -- the backend is now `backend/` in this same checkout,
# which also retires the vars.MIMIR_BACKEND_REPO / secrets.MIMIR_BACKEND_TOKEN
# pair that had to be configured for a tag build to work at all.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Verify the tag matches package.json
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $expected = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ($tag -ne $expected) {
            throw "Tag $tag does not match desktop/package.json version ($expected). Bump one or the other."
          }
          "Building $tag"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend runtime
        shell: pwsh
        working-directory: backend
        run: |
          python -m venv .venv-runtime
          .\.venv-runtime\Scripts\python.exe -m pip install --upgrade pip
          .\.venv-runtime\Scripts\python.exe -m pip install -r requirements-core-v2.txt
          .\.venv-runtime\Scripts\python.exe -m pip install pyinstaller

      - name: Backend tests
        shell: pwsh
        working-directory: backend
        run: .\.venv-runtime\Scripts\python.exe -m unittest discover -s mimir_core_v2 -t . -p "test_*.py"

      - name: Frontend checks
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      # age is bundled for encrypted training contributions and the sidecar
      # build refuses to proceed without the official binary.
      - name: Install age
        shell: pwsh
        run: winget install --id FiloSottile.age --exact --accept-source-agreements --accept-package-agreements

      # Signed, with updater artifacts -- NOT desktop:build:internal.
      #
      # RELEASE_READINESS.md is explicit that an internal build must never be
      # handed out as an external beta, because it produces no updater
      # artifacts. This workflow was calling exactly that, so every release it
      # drafted was one the updater could never serve.
      #
      # The key is not in the repo and never should be. Set it once as a repo
      # secret from C:\Mimir_Data\keys\mimir-updater.key (paste the file's
      # contents, not its path). The check below fails loudly rather than
      # letting Tauri emit its "public key has been found, but no private key"
      # message from deep inside a 90-minute build.
      - name: Check the updater signing key is configured
        shell: pwsh
        run: |
          if (-not '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}') {
            throw @"
          Repository secret TAURI_SIGNING_PRIVATE_KEY is not set.

          tauri.conf.json pins an updater public key and sets
          createUpdaterArtifacts, so a release build must be able to sign the
          update manifest. Add the secret under
          Settings -> Secrets and variables -> Actions, using the contents of
          the updater private key. Add TAURI_SIGNING_PRIVATE_KEY_PASSWORD too
          if the key is encrypted.
          "@
          }
          "Updater signing key is present."

      - name: Build installer
        shell: pwsh
        env:
          MIMIR_BACKEND_ROOT: ${{ github.workspace }}\backend
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem src-tauri\target\release\bundle\nsis -Filter "*$version*_x64-setup.exe" |
            Select-Object -First 1
          if (-not $exe) { throw "No installer matching version $version was produced." }

          # Copied to a fixed name because the download page links to
          # releases/latest/download/MimirSetup.exe, and that URL only resolves
          # if an asset is literally called that. Tauri names the bundle after
          # the version (Mimir_0.5.0-free-beta.1_x64-setup.exe), so uploading it
          # unchanged left the one public download link pointing at a 404 --
          # invisible here, because nothing in CI ever fetches that URL.
          #
          # The versioned name goes up as well, so a specific build stays
          # citable after `latest` has moved on.
          $stable = Join-Path $exe.DirectoryName "MimirSetup.exe"
          Copy-Item -LiteralPath $exe.FullName -Destination $stable -Force

          $sizeMb = [math]::Round($exe.Length / 1MB, 1)
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash

          # Updater signature, emitted next to the installer. Its absence means
          # the release cannot be served as an update, which is the whole
          # reason this job no longer uses the internal build.
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path -LiteralPath $sig)) {
            throw "No updater signature was produced next to $($exe.Name). The build did not sign the release."
          }

          "path=$($exe.FullName)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "stable=$stable"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature=$sig"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$sha"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "size=$sizeMb MB"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Built $($exe.Name) -- $sizeMb MB, SHA256 $sha"

      # The update manifest the installed app polls. tauri.conf.json points
      # its updater at releases/latest/download/latest.json, so without this
      # file every client gets a 404 and silently never updates -- the same
      # fixed-asset-name mechanism as MimirSetup.exe above.
      #
      # The URL here must be the VERSIONED asset, not MimirSetup.exe: the
      # signature is over those exact bytes, and pinning the update to a
      # specific build is the point. MimirSetup.exe is for humans clicking a
      # download link, and it moves when a new release is published.
      - name: Write the update manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ('${{ github.event.inputs.tag }}') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          $exe = Split-Path -Leaf '${{ steps.installer.outputs.path }}'
          $manifest = [ordered]@{
            version   = $version
            notes     = "See the release notes for what changed."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -LiteralPath '${{ steps.installer.outputs.signature }}' -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$exe"
              }
            }
          }
          $path = Join-Path (Split-Path -Parent '${{ steps.installer.outputs.path }}') "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath $path -Encoding utf8 -NoNewline
          "manifest=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content $path
        id: manifest

      # Proves the packaged sidecar runs, rather than only that it compiled.
      # A sidecar that builds but cannot start has shipped from here before.
      - name: Smoke-test the packaged sidecar
        shell: pwsh
        run: |
          $scan = "src-tauri\resources\mimir-backend\mimir-core-v2-scan.exe"
          if (-not (Test-Path $scan)) { throw "Packaged scanner is missing: $scan" }
          # Captured, not piped: piping into something that stops reading early
          # (Select-Object -First, Out-Null in some hosts) closes the pipe and
          # the exe reports a broken-pipe failure that has nothing to do with it.
          $output = & $scan --help 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Packaged scanner failed to start (exit $LASTEXITCODE)." }
          if (-not ($output -match 'mimir-core-v2-scan')) { throw "Packaged scanner produced unexpected output." }
          "Packaged scanner starts cleanly."

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Mimir ${{ github.event.inputs.tag || github.ref_name }}
          # MimirSetup.exe is what the README and download page link to.
          # The versioned exe and its .sig are what the updater pulls, named in
          # latest.json. All four have to be on the release or one of those two
          # paths breaks.
          files: |
            ${{ steps.installer.outputs.stable }}
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.signature }}
            ${{ steps.manifest.outputs.manifest }}
          body: |
            Free public beta. Windows 10/11, 64-bit.

            **[Download MimirSetup.exe](https://github.com/${{ github.repository }}/releases/latest/download/MimirSetup.exe)** -- ${{ steps.installer.outputs.size }}

            SHA-256: `${{ steps.installer.outputs.sha256 }}`

            Windows will show a "Windows protected your PC" warning, because the
            installer is not code-signed yet. Click **More info**, then **Run
            anyway**. See the [README](https://github.com/${{ github.repository }}#installing)
            for what that warning actually means.
