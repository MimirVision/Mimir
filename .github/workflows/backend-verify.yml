name: backend-verify

# Was backend/.github/workflows/core-v2-verify.yml. GitHub only runs workflows
# from the repo root, so it moved here when the repos merged.
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-verify.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-verify.yml'

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-core-v2.txt
      - name: Install Core v2 runtime
        run: python -m pip install -r requirements-core-v2.txt
      - name: Verify Core v2 contracts
        run: python mimir_core_v2_verify.py --level quick
      - name: Run Core v2 unit tests
        run: python -m unittest discover -s mimir_core_v2 -t . -p "test_*.py"
