name: desktop-verify

# Moved to the repo root for the monorepo: GitHub only runs workflows from
# .github/workflows at the top level, so leaving this under desktop/ would
# have silently stopped CI entirely.
#
# The path filter is what keeps the monorepo cheap -- an ingest-worker typo
# should not spend twenty minutes running the desktop suite. The workflow file
# itself is included so a change to CI still exercises CI.
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-verify.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-verify.yml'

defaults:
  run:
    working-directory: desktop

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (unused symbols)
        # Catches dead imports/locals left behind by refactors. Kept separate
        # so a genuine type error is not confused with tidiness.
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Unit tests
        run: npx vitest run

      - name: Dependency audit
        # High/critical only: the build must not silently accumulate known
        # vulnerabilities. Moderate and below are reported but not blocking.
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Rust tests
        # The Outbox and its upload paths live here, and were previously only
        # ever run locally.
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks
        run: npx playwright test tests/e2e/accessibility.spec.ts tests/e2e/screens.a11y.spec.ts

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: desktop/release_assets/accessibility_report.json
          if-no-files-found: ignore
