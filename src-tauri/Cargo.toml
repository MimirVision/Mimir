[package]
name = "mimir"
version = "0.1.0"
description = "Mimir - Incident Review for Vehicle Footage"
authors = ["Mimir"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "protocol-asset", "fs-read-file", "dialog-open", "shell-sidecar"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
