[package]
name = "mimir"
version = "0.5.0-free-beta.1"
description = "Local-first incident review for vehicle footage"
authors = ["Mimir"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-updater = "2"
base64 = "0.22"
# Already in Cargo.lock transitively (via reqwest's TLS stack), so declaring it
# directly adds no new code to the build and no new supply-chain surface --
# it just stops the evidence packet's digests depending on a crate that
# happens to be there.
sha2 = "0.10"
# "json" is needed by the chunked upload path: the multipart create/part/
# complete handshake exchanges small JSON bodies, unlike the single-shot
# route which posts raw bytes. Still no default features -- rustls only, no
# native-tls, no cookies.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
