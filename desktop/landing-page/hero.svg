<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Four Sentry cameras watching a parked car at night, with one angle flagged</title>
  <desc id="heroDesc">A car seen from above with four camera fields of view. Three are quiet; the left repeater is lit in red where something was detected. Below, a strip of review marks shows one important event among many empty ones.</desc>

  <defs>
    <!-- Mimir's own tokens. Nothing here invents a colour: the severity hues
         are the product's vocabulary, so the flagged cone is the same red the
         app uses for IMPORTANT. -->
    <radialGradient id="ground" cx="50%" cy="52%" r="72%">
      <stop offset="0%" stop-color="#131717"/>
      <stop offset="55%" stop-color="#0a0c0c"/>
      <stop offset="100%" stop-color="#050606"/>
    </radialGradient>

    <linearGradient id="coneQuiet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9db7aa" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#9db7aa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9db7aa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="coneAlert" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c47772" stop-opacity="0.46"/>
      <stop offset="55%" stop-color="#c47772" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c47772" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c47772" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c47772" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3130"/>
      <stop offset="100%" stop-color="#161b1a"/>
    </linearGradient>

    <linearGradient id="fadeEdges" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050606" stop-opacity="1"/>
      <stop offset="12%" stop-color="#050606" stop-opacity="0"/>
      <stop offset="88%" stop-color="#050606" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050606" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="900" fill="url(#ground)"/>

    <!-- Faint ground grid. Perspective is implied by spacing, not by a
         vanishing point: this is a top-down view, so a receding grid would be
         a lie about the geometry. -->
    <g stroke="#f4f1e9" stroke-opacity="0.028" stroke-width="1">
      <path d="M0 150H1600M0 260H1600M0 370H1600M0 480H1600M0 590H1600M0 700H1600M0 810H1600"/>
      <path d="M120 0V900M280 0V900M440 0V900M600 0V900M760 0V900M920 0V900M1080 0V900M1240 0V900M1400 0V900"/>
    </g>

    <!-- Range rings, centred on the car -->
    <g fill="none" stroke="#9db7aa" stroke-opacity="0.07">
      <circle cx="800" cy="470" r="190"/>
      <circle cx="800" cy="470" r="300"/>
      <circle cx="800" cy="470" r="415"/>
    </g>

    <!-- Three quiet camera fields -->
    <g>
      <path d="M800 392 L545 128 Q800 58 1055 128 Z" fill="url(#coneQuiet)"/>
      <path d="M800 548 L560 792 Q800 858 1040 792 Z" fill="url(#coneQuiet)"/>
      <path d="M852 442 L1182 302 Q1272 482 1172 642 Z" fill="url(#coneQuiet)"/>
    </g>

    <!-- The flagged one. A single loud thing on a quiet page: everything else
         is sage at 5-20% opacity, this is the app's IMPORTANT red. -->
    <ellipse cx="520" cy="470" rx="300" ry="250" fill="url(#alertGlow)"/>
    <path d="M748 442 L418 302 Q328 482 428 642 Z" fill="url(#coneAlert)"/>
    <path d="M748 442 L418 302" stroke="#c47772" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M748 442 L428 642" stroke="#c47772" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- What the camera found: a figure, close to the car -->
    <g opacity="0.92">
      <circle cx="556" cy="452" r="15" fill="#c47772" fill-opacity="0.22"/>
      <circle cx="556" cy="452" r="6" fill="#c47772"/>
      <circle cx="556" cy="452" r="30" fill="none" stroke="#c47772" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle cx="556" cy="452" r="48" fill="none" stroke="#c47772" stroke-opacity="0.18" stroke-width="1"/>
      <path d="M604 452 H700" stroke="#c47772" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 6"/>
    </g>

    <!-- The car, from above. Geometric rather than illustrated – this is a
         diagram of coverage, not a picture of a Tesla. -->
    <g>
      <rect x="748" y="352" width="104" height="238" rx="42" fill="url(#carBody)" stroke="#f4f1e9" stroke-opacity="0.16"/>
      <path d="M762 402 Q800 386 838 402 L832 448 Q800 440 768 448 Z" fill="#0c1010" fill-opacity="0.85"/>
      <path d="M766 506 Q800 498 834 506 L840 546 Q800 534 760 546 Z" fill="#0c1010" fill-opacity="0.7"/>
      <rect x="756" y="470" width="88" height="1" fill="#f4f1e9" fill-opacity="0.07"/>
    </g>

    <!-- The four camera positions -->
    <g>
      <circle cx="800" cy="360" r="3.5" fill="#9db7aa" fill-opacity="0.75"/>
      <circle cx="800" cy="582" r="3.5" fill="#9db7aa" fill-opacity="0.75"/>
      <circle cx="852" cy="442" r="3.5" fill="#9db7aa" fill-opacity="0.75"/>
      <circle cx="748" cy="442" r="5" fill="#c47772"/>
      <circle cx="748" cy="442" r="11" fill="none" stroke="#c47772" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>

    <!-- Camera labels -->
    <g font-family="'IBM Plex Mono', ui-monospace, Consolas, monospace" font-size="15" letter-spacing="1.4">
      <text x="800" y="118" fill="#f4f1e9" fill-opacity="0.34" text-anchor="middle">FRONT</text>
      <text x="800" y="836" fill="#f4f1e9" fill-opacity="0.34" text-anchor="middle">BACK</text>
      <text x="1210" y="278" fill="#f4f1e9" fill-opacity="0.34">RIGHT_REPEATER</text>
      <text x="390" y="278" fill="#c47772" fill-opacity="0.95" text-anchor="end">LEFT_REPEATER</text>
      <text x="390" y="304" fill="#c47772" fill-opacity="0.62" text-anchor="end">CONTACT: POSSIBLE</text>
    </g>

    <!-- The triage strip: a week of Sentry events. Almost all of it is nothing,
         which is the actual claim the product makes. -->
    <g transform="translate(0 862)">
      <rect x="176" y="-1" width="1248" height="2" fill="#f4f1e9" fill-opacity="0.06"/>
      <g fill="#858b8b" fill-opacity="0.42">
        <rect x="190" y="-7" width="2" height="14"/><rect x="218" y="-5" width="2" height="10"/>
        <rect x="252" y="-7" width="2" height="14"/><rect x="286" y="-4" width="2" height="8"/>
        <rect x="330" y="-6" width="2" height="12"/><rect x="368" y="-5" width="2" height="10"/>
        <rect x="404" y="-7" width="2" height="14"/><rect x="452" y="-4" width="2" height="8"/>
        <rect x="500" y="-6" width="2" height="12"/><rect x="548" y="-5" width="2" height="10"/>
        <rect x="600" y="-7" width="2" height="14"/><rect x="646" y="-4" width="2" height="8"/>
        <rect x="700" y="-6" width="2" height="12"/><rect x="742" y="-5" width="2" height="10"/>
        <rect x="800" y="-7" width="2" height="14"/><rect x="858" y="-4" width="2" height="8"/>
        <rect x="906" y="-6" width="2" height="12"/><rect x="960" y="-5" width="2" height="10"/>
        <rect x="1014" y="-7" width="2" height="14"/><rect x="1060" y="-4" width="2" height="8"/>
        <rect x="1112" y="-6" width="2" height="12"/><rect x="1168" y="-5" width="2" height="10"/>
        <rect x="1226" y="-7" width="2" height="14"/><rect x="1284" y="-4" width="2" height="8"/>
        <rect x="1340" y="-6" width="2" height="12"/><rect x="1396" y="-5" width="2" height="10"/>
      </g>
      <g fill="#c3a062" fill-opacity="0.72">
        <rect x="472" y="-11" width="2" height="22"/>
        <rect x="1136" y="-11" width="2" height="22"/>
      </g>
      <rect x="676" y="-19" width="3" height="38" fill="#c47772"/>
      <circle cx="677.5" cy="-28" r="3.5" fill="#c47772"/>
    </g>

    <rect width="1600" height="900" fill="url(#fadeEdges)"/>
  </g>
</svg>
